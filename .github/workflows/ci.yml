name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Inclui o teste de contrato OpenAPI x rotas Express x clientes web/Flutter.
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=moderate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # O E2E sobe a API real (descartável) a partir de backend/.
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm exec --prefix frontend -- tsc --noEmit -p tsconfig.json
        working-directory: frontend
      - run: npm run i18n:check --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm audit --prefix frontend --audit-level=moderate
      - run: npm audit --omit=dev --prefix frontend --audit-level=moderate
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Teste HTTP do app contra uma API descartável (banco e uploads temporários, integrações desligadas).
      - name: Live API test against a disposable backend
        run: |
          TEST_DIR="$(mktemp -d)"
          touch "$TEST_DIR/empty.env"
          (cd ../../backend && \
            NODE_ENV=test PORT=3334 DOTENV_CONFIG_PATH="$TEST_DIR/empty.env" \
            DATABASE_URL="$TEST_DIR/argos.sqlite" UPLOAD_DIR="$TEST_DIR/uploads" \
            JWT_SECRET="$(openssl rand -base64 48)" ADMIN_PASSWORD="$(openssl rand -base64 24)" \
            API_PUBLIC_URL=http://localhost:3334 FRONTEND_URL=http://localhost:5173 \
            ENABLE_TEST_MAIL_SINK=true TRUST_PROXY=false SMTP_HOST= \
            node --import tsx src/server.ts > "$TEST_DIR/server.log" 2>&1 &)
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3334/health/ready && break; sleep 1; done
          flutter test --dart-define=ARGOS_RUN_LIVE_TESTS=true --dart-define=ARGOS_TEST_API=http://localhost:3334/api/v1 test/live_api_test.dart

  # Imagem de produção (Dockerfile): build e teste de fumaça com configuração de produção e dados descartáveis.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t argos:ci .
      - name: Smoke test of the production image
        run: |
          docker run -d --name argos -p 3333:3333 \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e ADMIN_EMAIL=admin@argos-ci.example \
            -e ADMIN_PASSWORD="Ci-$(openssl rand -hex 12)-Xy9#" \
            -e FRONTEND_URL=https://argos-ci.example -e API_PUBLIC_URL=https://argos-ci.example \
            -e CORS_ORIGINS=https://argos-ci.example \
            -e SMTP_HOST=smtp.argos-ci.example -e SMTP_USER=ci -e SMTP_PASS=not-used-in-ci \
            -e MAIL_FROM='ARGOS <no-reply@argos-ci.example>' \
            argos:ci
          for attempt in $(seq 1 40); do curl -fsS http://localhost:3333/health/ready && break; sleep 2; done
          curl -fsS http://localhost:3333/health/ready | grep -q '"schemaVersion":4'
          curl -fsSI http://localhost:3333/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -fsS http://localhost:3333/ | grep -q 'og:image" content="https://argos-ci.example/icons/og-image.png"'
          curl -fsS http://localhost:3333/robots.txt | grep -q 'Sitemap: https://argos-ci.example/sitemap.xml'
          curl -fsS http://localhost:3333/manifest.webmanifest | grep -q '"short_name": "ARGOS"'
          asset="$(curl -fsS http://localhost:3333/ | grep -o '/assets/index-[^"]*\.js' | head -n 1)"
          curl -fsS -o /dev/null -D - -H 'Accept-Encoding: br' "http://localhost:3333$asset" | grep -qi '^content-encoding: br'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3333/assets/nao-existe.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3333/api/v1/config)" = 200
          docker exec argos node dist/ops/backup-cli.js backup --out /data/backups/ci | grep -q schemaVersion
          docker stop -t 15 argos
          docker logs argos 2>&1 | tail -n 20
          test "$(docker inspect -f '{{.State.ExitCode}}' argos)" = 0
