    Role:
      type: string
      enum:
        - user
        - citizen
        - space_manager
        - org_admin
        - moderator
        - support
        - admin
      description: |
        Papel GLOBAL da conta. `moderator` modera casos, pistas, conversas e denúncias; `support` consulta contas e avalia
        solicitações de acesso de cidadãos; `admin` tem tudo. `org_admin` e `space_manager` são papéis de ESCOPO: valem só
        por vínculo (`memberships`, convite aceito) e, como papel global, equivalem a cidadão (falha fechada).
        A administração atribui `citizen`, `moderator`, `support` ou `admin`.
