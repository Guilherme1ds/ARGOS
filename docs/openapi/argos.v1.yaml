          $ref: '#/components/responses/Unauthorized'
  /admin/access-requests/{id}:
    patch:
      tags: [Admin]
      summary: Aprova ou rejeita uma solicitação de acesso pendente.
      description: |
        Só pedidos `pending` são avaliados. Na aprovação, se ainda não existir conta com o e-mail, ela é criada
        confirmada e a resposta traz `temporaryPassword` (exibida uma única vez ao administrador, que a entrega por
        canal institucional).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                role:
                  type: string
                  enum: [citizen, admin]
                  default: citizen
      responses:
        '200':
          description: Solicitação revisada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  temporaryPassword:
                    type: string
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A solicitação já foi avaliada (`details.currentStatus`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
