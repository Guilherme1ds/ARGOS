    ItemStatus:
      type: string
      enum: [lost, found, claimed, returned]
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected]
    PublicItem:
      type: object
      required: [id, type, title, description, category, location, event_date, status, approval_status, created_at]
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/ItemType'
        title:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        approximate_place:
          type: string
          nullable: true
        event_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ItemStatus'
        approval_status:
          $ref: '#/components/schemas/ApprovalStatus'
        image_url:
          type: string
          nullable: true
