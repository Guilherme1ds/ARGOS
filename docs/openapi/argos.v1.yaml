openapi: 3.0.3
info:
  title: ARGOS API
  version: 1.0.0
  description: Contrato inicial da API versionada do ARGOS.
servers:
  - url: http://localhost:3333/api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Cria uma conta ou solicita acesso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '202':
          description: Solicitação de acesso enviada.
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Autentica usuário e emite sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie httpOnly do refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais inválidas. A mesma resposta é usada para e-mail inexistente e senha incorreta; o e-mail é comparado sem diferenciar maiúsculas e espaços.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Auth]
      security:
        - refreshCookie: []
      summary: Rotaciona refresh token e emite novo access token.
      description: |
        Cada refresh token é de uso único. Reapresentar um token já rotacionado é tratado como reuso:
        todas as sessões do usuário são revogadas e o cookie é limpo (401). Exceção: se o token foi
        rotacionado há até 10 segundos (requisições concorrentes ou outra aba), a resposta é 409 sem
        revogar nada nem alterar o cookie; o cliente deve repetir a chamada uma vez com o cookie atual.
        O limite de requisições é aplicado por sessão quando há cookie e por IP caso contrário.
      responses:
        '200':
          description: Sessão renovada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Token rotacionado por outra requisição há instantes. Repita a chamada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoga refresh token e encerra sessão.
      responses:
        '200':
          description: Sessão encerrada.
  /auth/me:
    get:
      tags: [Auth]
      summary: Retorna usuário autenticado.
      responses:
        '200':
          description: Usuário atual.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Auth]
      summary: Atualiza perfil e preferencias do usuario autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Auth]
      summary: Exclui a conta (anonimiza dados pessoais, remove casos abertos, pistas e acompanhamentos). Administradores são recusados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Conta excluída.
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Troca a senha, revoga todas as sessões e devolve uma nova sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        '200':
          description: Senha alterada; corpo igual ao do login.
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Envia por e-mail um link de redefinição (válido por 1 hora). Resposta idêntica para e-mails inexistentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Solicitação aceita.
  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      summary: Define nova senha com o token do e-mail (uso único) e encerra todas as sessões.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        '200':
          description: Senha redefinida.
        '400':
          description: Link inválido, usado ou expirado.
  /items/search:
    get:
      tags: [Items]
      security: []
      summary: Busca pública de itens aprovados.
      parameters:
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/ItemType'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/ItemStatus'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/HasImage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lista paginada de itens públicos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicItems'
  /items:
    get:
      tags: [Items]
      summary: Lista itens do usuário autenticado.
      responses:
        '200':
          description: Itens privados do usuário.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrivateItem'
    post:
      tags: [Items]
      summary: Publica item aprovado com data do ocorrido informada ou data atual.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Chave por usuário de 16 a 100 caracteres. Repetir o mesmo payload devolve o mesmo ID; mudar o payload retorna 409. Guarde a chave ao receber timeout.
          schema: { type: string, pattern: '^[a-zA-Z0-9_-]{16,100}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Item criado; resposta contém id e message.
        '200':
          description: Operação repetida; resposta contém id original, message e replayed verdadeiro.
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /items/following:
    get:
      tags: [Items]
      summary: Lista acompanhamentos visíveis da conta autenticada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Itens acompanhados, sem dados privados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /items/my-claims:
    get:
      tags: [Claims]
      summary: Lista apenas as solicitações enviadas pela conta autenticada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Resumo paginado sem provas ou identificação de outros solicitantes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        item_id: { type: integer }
                        item_title: { type: string }
                        item_status: { type: string }
                        status: { type: string, enum: [pending, approved, rejected] }
                        created_at: { type: string }
                  meta:
                    $ref: '#/components/schemas/MobilePageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /items/{id}:
    get:
      tags: [Items]
      security: []
      summary: Retorna detalhe público ou privado conforme sessão.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Detalhe do item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    oneOf:
                      - $ref: '#/components/schemas/PublicItem'
                      - $ref: '#/components/schemas/PrivateItem'
                  capabilities:
                    type: object
                    description: Capacidades calculadas pelo servidor; não substituem a autorização de cada operação.
                    properties:
                      edit: { type: boolean }
                      delete:
                        type: boolean
                        description: Autor ou moderador; casos devolvidos só podem ser excluídos por moderadores.
                      return: { type: boolean }
                      readClaims: { type: boolean }
                      claim: { type: boolean }
                  following: { type: boolean }
                  myClaim:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer }
                      status: { type: string }
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemHistory'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Items]
      summary: Atualiza item próprio ou moderado.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Item atualizado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Dados inválidos, tentativa de alterar o tipo ou imagem que não pertence ao usuário. Moderadores podem reenviar a imagem atual do autor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Items]
      summary: Exclui um item e seus dados dependentes.
      description: |
        Permitido ao autor e a perfis com `items:moderate`. Casos devolvidos são mantidos no histórico e só
        podem ser excluídos por moderadores. Pistas, reivindicações, acompanhamentos e correspondências são
        removidos em cascata; reivindicantes com pedido aberto e seguidores recebem notificação `item_removed`,
        e o autor é notificado quando a exclusão é feita pela moderação. A operação é registrada na auditoria.
        Um replay de `Idempotency-Key` da criação desse item passa a responder 409.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Item excluído.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  requestId: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Item inexistente, ou não aprovado e sem acesso do solicitante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Caso devolvido; apenas moderadores podem excluí-lo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /items/{id}/comments:
    get:
      tags: [Comments]
      security: []
      summary: Lista pistas públicas; informar page habilita paginação, sem page preserva a listagem legada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pistas publicas do item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  meta:
                    $ref: '#/components/schemas/MobilePageMeta'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      summary: Cria pista publica em item publicado.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Pista publica criada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /items/{id}/follow:
    post:
      tags: [Items]
      summary: Acompanha um caso para receber atualizacoes.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Caso acompanhado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Items]
      summary: Remove acompanhamento de um caso.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Acompanhamento removido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /items/{id}/report:
    post:
      tags: [Items]
      summary: Sinaliza item suspeito ou inadequado para moderacao.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Sinalizacao registrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /items/{id}/claim:
    post:
      tags: [Claims]
      summary: Cria reivindicação de item.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequest'
      responses:
        '201':
          description: Reivindicação criada.
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Claims]
      summary: Cancela a reivindicação aberta do próprio usuário; o caso volta ao status original se não restar outra.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reivindicação cancelada (status withdrawn).
        '404':
          $ref: '#/components/responses/NotFound'
  /items/{id}/claims:
    get:
      tags: [Claims]
      summary: Lista reivindicações de um item para dono ou usuário autorizado.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reivindicações do item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Claim'
                  requestId:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /items/{id}/claims/{claimId}/reject:
    patch:
      tags: [Claims]
      summary: Dono do caso (ou claims:review) recusa uma reivindicação aberta.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: claimId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reivindicação recusada.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Reivindicação já encerrada ou caso devolvido.
  /items/{id}/comments/{commentId}:
    delete:
      tags: [Comments]
      summary: Remove uma pista pública (autor ou items:moderate).
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pista removida.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /items/{id}/return:
    patch:
      tags: [Items]
      summary: Marca item como devolvido.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Devolução registrada.
        '403':
          $ref: '#/components/responses/Forbidden'
  /uploads:
    post:
      tags: [Uploads]
      summary: Envia imagem autenticada.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Upload criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: |
            Arquivo ausente, tipo diferente de JPEG/PNG/WebP, conteúdo que não corresponde ao tipo declarado
            (magic bytes), imagem corrompida ou mais de um arquivo no campo `file`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/items:
    get:
      tags: [Admin]
      summary: Lista itens para moderação global.
      parameters:
        - name: approvalStatus
          in: query
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ItemStatus'
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Itens para administração.
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/items/{id}/status:
    patch:
      tags: [Admin]
      summary: Atualiza aprovação ou status operacional.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approvalStatus:
                  $ref: '#/components/schemas/ApprovalStatus'
                status:
                  $ref: '#/components/schemas/ItemStatus'
                moderationNote:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Status atualizado.
  /admin/users:
    get:
      tags: [Admin]
      summary: Lista usuários.
      responses:
        '200':
          description: Usuários.
  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Atualiza role, status ou score anti-spam.
      description: Bloquear ou tornar pendente revoga imediatamente todos os refresh tokens do usuário.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [citizen, space_manager, org_admin, support, admin]
                status:
                  type: string
                  enum: [pending, active, blocked]
                spamScore:
                  type: integer
                  minimum: 0
                  maximum: 10
      responses:
        '200':
          description: Usuário atualizado.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Dados inválidos ou tentativa do administrador de remover o próprio acesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/access-requests:
    get:
      tags: [Admin]
      summary: Lista solicitações de acesso.
      responses:
        '200':
          description: Solicitações.
  /admin/access-requests/{id}:
    patch:
      tags: [Admin]
      summary: Aprova ou rejeita solicitação de acesso.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Solicitação revisada.
  /audit-logs:
    get:
      tags: [Audit]
      summary: Lista eventos de auditoria para admin global.
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Eventos de auditoria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    type: object
                  requestId:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications:
    get:
      tags: [Notifications]
      summary: Lista notificações do usuário.
      responses:
        '200':
          description: Notificações.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  requestId:
                    type: string
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Conta notificações não lidas.
      responses:
        '200':
          description: Total de não lidas.
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Marca notificações do usuário como lidas.
      responses:
        '200':
          description: Notificações marcadas.
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Marca uma notificação do usuário como lida (idempotente).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notificação marcada.
        '404':
          description: Notificação inexistente ou de outro usuário.
  /reports/items.csv:
    get:
      tags: [Reports]
      summary: Exporta relatório CSV de itens.
      responses:
        '200':
          description: Arquivo CSV.
          content:
            text/csv:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /privacy/summary:
    get:
      tags: [Privacy]
      security: []
      summary: Retorna resumo básico de privacidade.
      responses:
        '200':
          description: Resumo de privacidade.
  /privacy/export:
    get:
      tags: [Privacy]
      summary: Exporta em JSON os dados da própria conta (portabilidade LGPD).
      responses:
        '200':
          description: Arquivo JSON (Content-Disposition attachment).
        '401':
          $ref: '#/components/responses/Unauthorized'
  /config:
    get:
      tags: [Config]
      security: []
      summary: Integrações ligadas no servidor (mapa, IA, tradução, Google, Turnstile, chave pública de push). Nunca expõe segredos.
      responses:
        '200':
          description: Configuração pública.
  /items/map:
    get:
      tags: [Items]
      security: []
      summary: Casos aprovados com marcação no mapa (coordenadas arredondadas a ~11 m). Filtros type e includeReturned.
      responses:
        '200':
          description: Até 500 casos com latitude e longitude.
  /items/{id}/translate:
    post:
      tags: [Items]
      security: []
      summary: Traduz título e descrição (DeepL ou LibreTranslate), com cache por idioma. 503 quando não configurado.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language:
                  type: string
                  enum: [pt-BR, en-US, es-ES]
      responses:
        '200':
          description: Tradução.
        '503':
          description: Tradução automática não configurada.
  /ai/describe-item:
    post:
      tags: [AI]
      summary: Sugere título, categoria e descrição a partir de uma foto enviada pela própria conta (Claude API). 503 quando não configurado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageUrl]
              properties:
                imageUrl:
                  type: string
                  example: /uploads/1790000000000-abc12345.jpg
      responses:
        '200':
          description: Sugestões (title, category, description, color, distinctiveFeatures).
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: IA não configurada.
  /auth/google:
    post:
      tags: [Auth]
      security: []
      summary: Login com Google (ID token do Google Identity Services). Conta nova exige privacyTermsAccepted (senão 422 com details.code terms_required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                privacyTermsAccepted:
                  type: boolean
      responses:
        '200':
          description: Sessão criada; corpo igual ao do login.
        '401':
          description: Token do Google inválido ou e-mail não verificado.
        '422':
          $ref: '#/components/responses/ValidationError'
  /push/subscribe:
    post:
      tags: [Push]
      summary: Registra a inscrição Web Push do navegador (PushSubscription.toJSON()).
      responses:
        '201':
          description: Inscrição salva.
    delete:
      tags: [Push]
      summary: Remove a inscrição Web Push pelo endpoint.
      responses:
        '200':
          description: Inscrição removida.
  /push/test:
    post:
      tags: [Push]
      summary: Envia uma notificação de teste para os navegadores inscritos do usuário.
      responses:
        '200':
          description: Enviada.
  /admin/mail-test:
    post:
      tags: [Admin]
      summary: Confere a conexão SMTP e envia um e-mail de teste ao administrador.
      responses:
        '200':
          description: Resultado (configured true/false).
        '502':
          description: Servidor SMTP recusou a conexão.
  /health:
    get:
      tags: [Health]
      security: []
      summary: Health check legado da API.
      responses:
        '200':
          description: Serviço ativo.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: argos_refresh
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    SearchText:
      name: q
      in: query
      schema:
        type: string
    ItemType:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/ItemType'
    Category:
      name: category
      in: query
      schema:
        type: string
    Location:
      name: location
      in: query
      schema:
        type: string
    ItemStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/ItemStatus'
    FromDate:
      name: from
      in: query
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      schema:
        type: string
        format: date
    HasImage:
      name: hasImage
      in: query
      schema:
        type: boolean
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [newest, oldest, event_date_desc, event_date_asc]
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  schemas:
    MobilePageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    Role:
      type: string
      enum: [user, citizen, space_manager, org_admin, support, admin]
    Permission:
      type: string
    User:
      type: object
      required: [id, name, email, role, status]
      properties:
        id:
          type: integer
        name:
          type: string
        nickname:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [pending, active, blocked]
        spamScore:
          type: integer
        avatarUrl:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        preferredContact:
          type: string
          enum: [in_app, email]
        language:
          type: string
          enum: [pt-BR, en-US, es-ES]
        theme:
          type: string
          enum: [system, light, dark]
        timezone:
          type: string
        dateFormat:
          type: string
          enum: [dd/MM/yyyy, MM/dd/yyyy, yyyy-MM-dd]
        compactMode:
          type: boolean
        highContrast:
          type: boolean
        notificationPreferences:
          $ref: '#/components/schemas/NotificationPreferences'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    NotificationPreferences:
      type: object
      properties:
        emailEnabled:
          type: boolean
        inAppEnabled:
          type: boolean
        digestEnabled:
          type: boolean
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        nickname:
          type: string
          nullable: true
          maxLength: 40
          description: Identificador publico exibido no feed.
        avatarUrl:
          type: string
          nullable: true
          description: Caminho de upload do ARGOS ou URL http(s).
        phone:
          type: string
          nullable: true
          maxLength: 30
        department:
          type: string
          nullable: true
          maxLength: 120
        bio:
          type: string
          nullable: true
          maxLength: 300
        preferredContact:
          type: string
          enum: [in_app, email]
        language:
          type: string
          enum: [pt-BR, en-US, es-ES]
        theme:
          type: string
          enum: [system, light, dark]
        timezone:
          type: string
        dateFormat:
          type: string
          enum: [dd/MM/yyyy, MM/dd/yyyy, yyyy-MM-dd]
        compactMode:
          type: boolean
        highContrast:
          type: boolean
        notificationPreferences:
          $ref: '#/components/schemas/NotificationPreferences'
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        requestAccess:
          type: boolean
        reason:
          type: string
        privacyTermsAccepted:
          type: boolean
        privacyTermsVersion:
          type: string
          default: '2026-08-18'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
    ItemType:
      type: string
      enum: [lost, found]
    ItemStatus:
      type: string
      enum: [lost, found, claimed, returned]
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected]
    PublicItem:
      type: object
      required: [id, type, title, description, category, location, event_date, status, approval_status, created_at]
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/ItemType'
        title:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        approximate_place:
          type: string
          nullable: true
        event_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ItemStatus'
        approval_status:
          $ref: '#/components/schemas/ApprovalStatus'
        image_url:
          type: string
          nullable: true
        owner_nickname:
          type: string
        owner_avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
        comments_count:
          type: integer
        latest_comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    PrivateItem:
      allOf:
        - $ref: '#/components/schemas/PublicItem'
        - type: object
          properties:
            owner_id:
              type: integer
            owner_name:
              type: string
            campus_block:
              type: string
              nullable: true
            contact_preference:
              type: string
              enum: [in_app, email]
            moderation_note:
              type: string
              nullable: true
            updated_at:
              type: string
    CreateItemRequest:
      type: object
      required: [type, title, description, category, location]
      properties:
        type:
          $ref: '#/components/schemas/ItemType'
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 2000
        category:
          type: string
        location:
          type: string
        campusBlock:
          type: string
        approximatePlace:
          type: string
        eventDate:
          type: string
          format: date
          description: Campo legado opcional; se enviado, não pode ser futuro. A data gravada é definida pelo servidor.
        imageUrl:
          type: string
        contactPreference:
          type: string
          enum: [in_app, email]
    UpdateItemRequest:
      allOf:
        - $ref: '#/components/schemas/CreateItemRequest'
    Comment:
      type: object
      required: [id, item_id, user_id, author_name, body, created_at]
      properties:
        id:
          type: integer
        item_id:
          type: integer
        user_id:
          type: integer
        author_name:
          type: string
        author_nickname:
          type: string
        author_avatar_url:
          type: string
          nullable: true
        body:
          type: string
        created_at:
          type: string
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 500
    CreateClaimRequest:
      type: object
      required: [message, proofDetails]
      properties:
        message:
          type: string
          minLength: 10
          maxLength: 1000
        proofDetails:
          type: string
          minLength: 10
          maxLength: 1000
    Claim:
      type: object
      properties:
        id:
          type: integer
        item_id:
          type: integer
        claimant_id:
          type: integer
        claimant_name:
          type: string
        message:
          type: string
        proof_details:
          type: string
        status:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    ItemHistory:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        details:
          type: string
          nullable: true
        created_at:
          type: string
    Notification:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        type:
          type: string
        action_url:
          type: string
          nullable: true
        read_at:
          type: string
          nullable: true
        created_at:
          type: string
    Upload:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        actor_id:
          type: integer
          nullable: true
        actor_name:
          type: string
          nullable: true
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
          nullable: true
        metadata:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
    PaginatedPublicItems:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicItem'
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            sort:
              type: string
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        details:
          type: object
        requestId:
          type: string
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
        requestId:
          type: string
  responses:
    Unauthorized:
      description: Não autenticado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sem permissão.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflito.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Limite de requisições atingido. O cabeçalho `Retry-After` informa os segundos de espera.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Corpo JSON acima de `MAX_BODY_MB` ou arquivo acima de `MAX_UPLOAD_MB`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Dados inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
