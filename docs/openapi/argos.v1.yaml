              type: string
            campus_block:
              type: string
              nullable: true
            contact_preference:
              type: string
              enum: [in_app, email]
            moderation_note:
              type: string
              nullable: true
            updated_at:
              type: string
    CreateItemRequest:
      type: object
      required: [type, title, description, category, location]
      properties:
        type:
          $ref: '#/components/schemas/ItemType'
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 2000
        category:
          type: string
        location:
          type: string
        campusBlock:
          type: string
        approximatePlace:
          type: string
        eventDate:
          type: string
          format: date
          description: Data do ocorrido (YYYY-MM-DD). Opcional; padrão = hoje. Não pode ser futura.
        imageUrl:
          type: string
        contactPreference:
          type: string
          enum: [in_app, email]
          default: in_app
          description: Informativo e sem efeito no comportamento atual. Todo contato acontece pelo ARGOS (reivindicação privada e notificações); o e-mail de ninguém é exibido.
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
    UpdateItemRequest:
      type: object
      description: Edição parcial. Campos ausentes ficam como estão (inclusive `contactPreference`); `type` não pode mudar; latitude e longitude andam juntas (null remove a marcação).
      properties:
        type:
          $ref: '#/components/schemas/ItemType'
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 2000
        category:
          type: string
        location:
          type: string
        campusBlock:
          type: string
        approximatePlace:
          type: string
        eventDate:
          type: string
          format: date
        imageUrl:
          type: string
          description: Caminho de upload da própria conta; vazio remove a foto.
        contactPreference:
          type: string
          enum: [in_app, email]
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
    Comment:
      type: object
