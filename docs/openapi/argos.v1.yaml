              properties:
                open:
                  type: integer
                in_review:
                  type: integer
                resolved:
                  type: integer
                dismissed:
                  type: integer
    ItemReportUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ItemReportStatus'
        assignee:
          nullable: true
          description: '"me" assume; null libera; número atribui a outro administrador ativo.'
          oneOf:
            - type: string
              enum:
                - me
            - type: integer
        resolutionNote:
          type: string
          maxLength: 500
        expectedStatus:
          $ref: '#/components/schemas/ItemReportStatus'
