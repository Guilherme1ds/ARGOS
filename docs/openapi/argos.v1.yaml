        - status
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
        timestamp:
          type: string
    HealthReady:
      type: object
      required:
        - status
        - database
        - schemaVersion
      properties:
        status:
          type: string
          enum:
            - ready
        database:
          type: string
        schemaVersion:
          type: integer
        version:
          type: string
    ScopedRole:
      type: string
      enum: [org_admin, space_manager]
      description: Papel de escopo, concedido por convite aceito. `org_admin` vale na organização inteira; `space_manager`, só no espaço.
    Membership:
      type: object
      required: [organizationId, spaceId, role]
      properties:
        organizationId: { type: integer }
        organizationName: { type: string }
        spaceId: { type: integer, nullable: true }
        spaceName: { type: string, nullable: true }
        role:
          $ref: '#/components/schemas/ScopedRole'
    PublicSpace:
      type: object
      required: [id, name, organizationId, organizationName]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        organizationId: { type: integer }
        organizationName: { type: string }
    OrganizationRequest:
      type: object
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        contactEmail: { type: string, description: E-mail institucional opcional (vazio remove). }
    Organization:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        status:
          type: string
          enum: [active, archived]
        spacesCount: { type: integer }
        membersCount: { type: integer }
        myRoles:
          type: array
          items:
            $ref: '#/components/schemas/ScopedRole'
        canManage: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    SpaceRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        address: { type: string, maxLength: 200 }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
    Space:
      type: object
      required: [id, organizationId, name, status]
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        address: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        status:
          type: string
          enum: [active, archived]
        itemsCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    InviteStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
    InviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role:
          $ref: '#/components/schemas/ScopedRole'
        spaceId: { type: integer, description: Obrigatório para `space_manager`; proibido para `org_admin`. }
    InviteTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
    Invite:
      type: object
      required: [id, email, role, status, expiresAt]
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        spaceId: { type: integer, nullable: true }
        spaceName: { type: string, nullable: true }
        email: { type: string }
        role:
          $ref: '#/components/schemas/ScopedRole'
        status:
          $ref: '#/components/schemas/InviteStatus'
        invitedByName: { type: string, nullable: true }
        expiresAt: { type: string }
        acceptedAt: { type: string, nullable: true }
        createdAt: { type: string }
    OrganizationDetail:
      type: object
      required: [organization, spaces, members, invites]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/Space'
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              userId: { type: integer }
              name: { type: string }
              email: { type: string }
              role:
                $ref: '#/components/schemas/ScopedRole'
              spaceId: { type: integer, nullable: true }
              spaceName: { type: string, nullable: true }
              createdAt: { type: string }
        invites:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
    ChatMessage:
      type: object
      required: [id, conversation_id, mine, body, removed, created_at]
      properties:
        id: { type: integer }
        conversation_id: { type: integer }
        mine: { type: boolean }
        body: { type: string }
        removed: { type: boolean }
        safetyNotice:
          type: string
          nullable: true
          enum: [contact_info, payment_request]
          description: Lembrete de segurança exibido junto da mensagem.
        created_at: { type: string }
    Conversation:
      type: object
      required: [id, status, role, item, counterpart, unread]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [open, closed]
        closedByMe: { type: boolean }
        role:
          type: string
          enum: [owner, participant]
        item:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
            type: { type: string }
            status: { type: string }
            image_url: { type: string, nullable: true }
        counterpart:
          type: object
          description: A outra parte aparece só pelo apelido público.
          properties:
            nickname: { type: string }
            avatar_url: { type: string, nullable: true }
        lastReadId: { type: integer }
        unread: { type: integer }
        lastMessage:
          type: object
          nullable: true
          description: Última mensagem, com a mesma forma de ChatMessage.
        lastMessageAt: { type: string, nullable: true }
        createdAt: { type: string }
    ConversationEnvelope:
      type: object
      required: [conversation]
      properties:
        id: { type: integer }
        message: { type: string }
        conversation:
          $ref: '#/components/schemas/Conversation'
    CustodyState:
      type: string
      enum: [none, in_custody, in_transit, handed_over, disposed]
    CustodyEventType:
      type: string
      enum: [received, stored, transferred, handed_over, disposed, note]
    CustodyEventRequest:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/CustodyEventType'
        spaceId: { type: integer, description: received (espaço que recebe) ou transferred (destino). }
        storageLocation: { type: string, maxLength: 120, description: Obrigatório em `stored`. }
        notes: { type: string, maxLength: 500, description: Obrigatório em `disposed`. }
        claimId: { type: integer, description: Reivindicação de quem retirou (handed_over de item encontrado). }
    CustodyEvent:
      type: object
      required: [id, sequence, type, occurredAt, hash, prevHash]
      properties:
        id: { type: integer }
        sequence: { type: integer }
        type:
          $ref: '#/components/schemas/CustodyEventType'
        spaceId: { type: integer, nullable: true }
        spaceName: { type: string, nullable: true }
        storageLocation: { type: string, nullable: true }
        claimId: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        actorName: { type: string, nullable: true }
        occurredAt: { type: string }
        hash: { type: string }
        prevHash: { type: string }
    CustodyChain:
      type: object
      required: [item, state, chain, nextEvents, data]
      properties:
        item:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
            type: { type: string }
            status: { type: string }
            spaceId: { type: integer, nullable: true }
        state:
          $ref: '#/components/schemas/CustodyState'
        currentSpaceId: { type: integer, nullable: true }
        chain:
          type: object
          properties:
            valid: { type: boolean }
            brokenAt: { type: integer, nullable: true }
        nextEvents:
          type: array
          items:
            $ref: '#/components/schemas/CustodyEventType'
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustodyEvent'
    CustodyPanel:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
              type: { type: string }
              status: { type: string }
              state:
                $ref: '#/components/schemas/CustodyState'
              space_id: { type: integer, nullable: true }
              space_name: { type: string, nullable: true }
              storage_location: { type: string, nullable: true }
              custody_since: { type: string, nullable: true }
              last_event_at: { type: string, nullable: true }
              open_claims: { type: integer }
              overdue: { type: boolean }
        meta:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            state: { type: string }
            overdueDays: { type: integer }
            summary: { type: object }
            spaces:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  organizationName: { type: string }
    SynonymRequest:
      type: object
      required: [terms]
      properties:
        terms:
          type: array
          minItems: 2
          maxItems: 12
          items: { type: string, minLength: 2, maxLength: 40 }
    SynonymGroup:
      type: object
      required: [id, terms]
      properties:
        id: { type: integer }
        terms:
          type: array
          items: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    SearchFacetValue:
      type: object
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer }
    SearchFacets:
      type: object
      description: Cada faceta conta os resultados ignorando o próprio filtro e respeitando os demais.
      properties:
        type:
          type: array
          items:
            $ref: '#/components/schemas/SearchFacetValue'
        status:
          type: array
          items:
            $ref: '#/components/schemas/SearchFacetValue'
        category:
          type: array
          items:
            $ref: '#/components/schemas/SearchFacetValue'
        space:
          type: array
          items:
            $ref: '#/components/schemas/SearchFacetValue'
        hasImage:
          type: array
          items:
            $ref: '#/components/schemas/SearchFacetValue'
    RetentionReport:
      type: object
      description: Quantidade eliminada ou anonimizada por categoria.
      properties:
        mailOutbox: { type: integer }
        passwordResets: { type: integer }
        emailVerifications: { type: integer }
        accessRequests: { type: integer }
        auditLogs: { type: integer }
        unverifiedAccounts: { type: integer }
        claimProofs: { type: integer }
        notifications: { type: integer }
        conversations: { type: integer }
        moderationEvents: { type: integer }
        expiredInvites: { type: integer }
    RetentionStatus:
      type: object
      required: [rules, runs]
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RetentionRule'
        lastRun:
          type: object
          nullable: true
          properties:
            at: { type: string }
            trigger:
              type: string
              enum: [schedule, manual]
            total: { type: integer }
        runs:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              trigger:
                type: string
                enum: [schedule, manual]
              total: { type: integer }
              report:
                $ref: '#/components/schemas/RetentionReport'
              started_at: { type: string }
              finished_at: { type: string }
              actor_name: { type: string, nullable: true }
    SystemAlert:
      type: object
      properties:
        id: { type: integer }
        alert_key: { type: string }
        severity:
          type: string
          enum: [warning, critical]
        title: { type: string }
        detail: { type: string }
        status:
          type: string
          enum: [firing, resolved]
        value: { type: number, nullable: true }
        threshold: { type: number, nullable: true }
        fired_at: { type: string }
        last_seen_at: { type: string }
        resolved_at: { type: string, nullable: true }
    TrafficWindow:
      type: object
      properties:
        minutes: { type: integer }
        requests: { type: integer }
        errors5xx: { type: integer }
        errors4xx: { type: integer }
        errorRatePercent: { type: number }
        p50Ms: { type: integer }
        p95Ms: { type: integer }
        p99Ms: { type: integer }
    ObservabilityOverview:
      type: object
      required: [service, process, dependencies, traffic, alerts]
      properties:
        service:
          type: object
          properties:
            name: { type: string }
            environment: { type: string }
            version: { type: string }
            schemaVersion: { type: integer, nullable: true }
        process:
          type: object
          properties:
            uptimeSeconds: { type: integer }
            startedAt: { type: string }
            memoryRssMb: { type: integer }
            heapUsedMb: { type: integer }
            eventLoopDelayP99Ms: { type: integer }
            inFlightRequests: { type: integer }
            node: { type: string }
        dependencies:
          type: object
          properties:
            database:
              type: string
              enum: [ok, unavailable]
            mail:
              type: string
              enum: [configured, not_configured]
            tracingExport:
              type: string
              enum: [enabled, disabled]
            metricsEndpoint:
              type: string
              enum: [enabled, disabled]
        traffic:
          type: object
          properties:
            last5m:
              $ref: '#/components/schemas/TrafficWindow'
            last60m:
              $ref: '#/components/schemas/TrafficWindow'
            series:
              type: array
              items:
                type: object
                properties:
                  at: { type: string }
                  requests: { type: integer }
                  errors: { type: integer }
                  p95Ms: { type: integer }
            routes:
              type: array
              items:
                type: object
                properties:
                  route: { type: string }
                  count: { type: integer }
                  errors: { type: integer }
                  avgMs: { type: integer }
        tracing:
          type: object
          properties:
            exported: { type: integer }
            dropped: { type: integer }
            failures: { type: integer }
        thresholds:
          type: object
        business:
          type: object
          nullable: true
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/SystemAlert'
        recentProblems:
          type: array
          items:
            type: object
            properties:
              ts: { type: string }
              level: { type: string }
              event: { type: string }
              traceId: { type: string }
              message: { type: string }
  responses:
    Unauthorized:
      description: Não autenticado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sem permissão.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflito.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Limite de requisições atingido. O cabeçalho `Retry-After` informa os segundos de espera.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Corpo JSON acima de `MAX_BODY_MB` ou arquivo acima de `MAX_UPLOAD_MB`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Dados inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
