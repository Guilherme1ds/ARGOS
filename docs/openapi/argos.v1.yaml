          type: string
          nullable: true
        assigned_to:
          type: integer
          nullable: true
        assignee_name:
          type: string
          nullable: true
        resolution_note:
          type: string
          nullable: true
        resolved_by:
          type: integer
          nullable: true
        resolver_name:
          type: string
          nullable: true
        resolved_at:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
    ItemReportPage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemReport'
        meta:
          type: object
          required:
            - page
            - limit
            - total
            - status
            - counts
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            status:
              type: string
            counts:
