            controller:
              type: string
            purposes:
              type: array
              items:
                type: string
            publicDataPolicy:
              type: string
            userRights:
              type: array
              items:
                type: string
              description: Cada direito indica a ação disponível no produto.
            externalProcessors:
              type: string
            retention:
              type: array
              items:
                $ref: '#/components/schemas/RetentionRule'
            consents:
              type: array
              items:
                $ref: '#/components/schemas/Consent'
            consentStatus:
              allOf:
                - $ref: '#/components/schemas/ConsentStatus'
              nullable: true
