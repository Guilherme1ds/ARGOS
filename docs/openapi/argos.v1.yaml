  /admin/reports:
    get:
      tags:
        - Admin
      summary: Fila de denúncias paginada, filtrável por estado (padrão `active` = abertas + em análise).
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - all
              - open
              - in_review
              - resolved
              - dismissed
            default: active
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página da fila.
          content:
