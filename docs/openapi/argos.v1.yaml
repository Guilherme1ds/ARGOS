        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{id}/invites:
    post:
      tags: [Organizations]
      summary: Convida alguém por e-mail para administrar a organização ou gerir um espaço (`org:manage`).
      description: |
        O link (`/invite#token=...`) vale 7 dias e uma vez; só o hash do token fica no banco. Reenviar para a mesma
        pessoa/papel/espaço cancela o convite pendente anterior. `space_manager` exige `spaceId`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: Convite enviado.
          content:
            application/json:
              schema:
                type: object
                required: [id, message, invite]
                properties:
                  id: { type: integer }
                  message: { type: string }
                  invite:
                    $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /organizations/{id}/invites/{inviteId}:
    delete:
      tags: [Organizations]
      summary: Cancela um convite pendente (`org:manage`).
      parameters:
