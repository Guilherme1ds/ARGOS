            `terms_outdated`, `verification_invalid` (400), `publishing_restricted` (403).
        errors:
          type: object
          description: Erros de validação por campo (422).
          properties:
            formErrors:
              type: array
              items:
                type: string
            fieldErrors:
              type: object
        requestId:
          type: string
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
        requestId:
          type: string
    MessageResponse:
