        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{id}/members/{memberId}:
    delete:
      tags: [Organizations]
      summary: Remove um vínculo de gestão (`org:manage`). O último administrador da organização não pode sair sozinho.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: memberId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Vínculo removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /conversations:
    get:
      tags: [Chat]
      summary: Conversas da conta (como quem publicou ou como interessado), com não lidas e última mensagem.
      responses:
        '200':
          description: Conversas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Chat]
      summary: Abre (ou reaproveita) a conversa privada com quem publicou o caso.
      description: Caso devolvido não aceita conversa nova. Conta silenciada recebe 403 `chat_muted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: integer }
      responses:
        '200':
          description: Conversa existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationEnvelope'
        '201':
          description: Conversa criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /conversations/unread-count:
    get:
      tags: [Chat]
      summary: Total de mensagens não lidas em todas as conversas da conta.
      responses:
        '200':
          description: Contagem.
          content:
            application/json:
              schema:
                type: object
                required: [total]
                properties:
                  total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /conversations/moderation/flagged:
    get:
      tags: [Chat]
      summary: Fila da moderação com as mensagens sinalizadas (regra automática ou denúncia) (`chat:moderate`).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Mensagens sinalizadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /conversations/moderation/messages/{messageId}:
    patch:
      tags: [Chat]
      summary: Remove a mensagem sinalizada (conta para a reincidência) ou descarta a sinalização (`chat:moderate`).
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [remove, dismiss]
      responses:
        '200':
          description: Mensagem revisada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /conversations/{id}:
    patch:
      tags: [Chat]
      summary: Encerra ou reabre a conversa (só quem encerrou reabre).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, closed]
      responses:
        '200':
          description: Conversa atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{id}/messages:
    get:
      tags: [Chat]
      summary: Mensagens da conversa (as mais recentes, ou só as posteriores a `after` para consulta periódica). Marca como lidas.
      description: |
        Com `after`, também voltam as mensagens recebidas ainda não entregues (id entre o marcador de leitura da conta e
        `after`), para o cliente não perder a mensagem que chegou um instante antes de um envio. O cursor `after` deve ser
        a última mensagem recebida por esta consulta; enviar uma mensagem não muda o marcador de leitura.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Mensagens.
          content:
            application/json:
              schema:
                type: object
                required: [conversation, data]
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Chat]
      summary: Envia uma mensagem, sujeita às regras automáticas de moderação.
      description: |
        Bloqueadas (422 `content_blocked`, com `details.rule`): linguagem ofensiva, links externos (com `http(s)://`, `www.`
        ou domínio como `site.com.br` e `wa.me/...`), número de documento ou cartão, mensagem repetida. Sinalizadas para
        revisão (entregues): pedido de pagamento (pix, boleto, valor, dados do cartão; "depósito", "transferência" e
        "cartão de crédito" sozinhos não contam) e palavra que também é nome de objeto (piranha, macaco) dirigida à pessoa
        (`offensive_language`); como objeto, ela nunca bloqueia. Com aviso de segurança (entregues): e-mail ou telefone. `CHAT_MUTE_STRIKES` bloqueios em 24 h silenciam a conta (403 `chat_muted`).
        Conversa encerrada responde 409 `conversation_closed`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Mensagem enviada.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: '#/components/schemas/ChatMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /conversations/{id}/messages/{messageId}/report:
    post:
      tags: [Chat]
      summary: Denuncia uma mensagem recebida; ela vai para a fila da moderação.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Mensagem já estava em análise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '201':
          description: Denúncia registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /custody:
    get:
      tags: [Custody]
      summary: Painel de custódia dos espaços que a conta gere (`custody:read`; administração vê todos).
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [in_custody, in_transit, awaiting, handed_over, disposed, overdue, all]
            default: in_custody
        - name: spaceId
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Itens e resumo por estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyPanel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /custody/items/{itemId}:
    get:
      tags: [Custody]
      summary: Cadeia de custódia do item, com verificação de integridade dos hashes.
      description: Quem publicou vê os eventos sem o nome de quem operou; gestores do espaço e a administração veem tudo.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Trilha do item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyChain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /custody/items/{itemId}/events:
    post:
      tags: [Custody]
      summary: Registra um evento de custódia (recebido, guardado, transferido, entregue, destinado ou anotação).
      description: |
        A trilha é somente-inserção e encadeada por SHA-256. Transições: nenhum → received; em custódia → stored,
        transferred, handed_over, disposed, note; em trânsito → received (pelo destino), note; encerrado → note.
        `handed_over` registra a devolução do caso (mesma regra de `PATCH /items/{id}/return`). Transição inválida: 409
        `custody_invalid_transition`.
        Primeiro `received` (passa o caso para o espaço que recebeu): caso ligado a um espaço só é recebido por quem gere
        esse espaço ou a organização dele, num espaço da mesma organização (403/422); caso sem espaço, só item encontrado
        e publicado (422). A administração da plataforma não tem a restrição de espaço.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodyEventRequest'
      responses:
        '201':
          description: Evento registrado.
          content:
            application/json:
              schema:
                type: object
                required: [id, message, state, event]
                properties:
                  id: { type: integer }
                  message: { type: string }
                  state:
                    $ref: '#/components/schemas/CustodyState'
                  event:
                    $ref: '#/components/schemas/CustodyEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /observability:
    get:
      tags: [Observability]
      summary: Painel de saúde da API (tráfego, latência, dependências, números de negócio e alertas) (`platform:admin`).
      responses:
        '200':
          description: Visão consolidada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/synonyms:
    get:
      tags: [Admin]
      summary: Dicionário de sinônimos da busca (`platform:admin`).
      responses:
        '200':
          description: Grupos de sinônimos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SynonymGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Cria um grupo de termos equivalentes (normalizados sem acento e em minúsculas).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynonymRequest'
      responses:
        '201':
          description: Grupo criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/synonyms/{id}:
    put:
      tags: [Admin]
      summary: Substitui os termos de um grupo.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynonymRequest'
      responses:
        '200':
          description: Grupo atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin]
      summary: Remove um grupo de sinônimos.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Grupo removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/retention:
    get:
      tags: [Admin]
      summary: Prazos de retenção aplicados, última execução automática e histórico do que foi eliminado.
      responses:
        '200':
          description: Situação da retenção.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/retention/run:
    post:
      tags: [Admin]
      summary: Executa agora a rotina de retenção e eliminação (a mesma que roda de hora em hora). Auditado.
      responses:
        '200':
          description: Relatório da execução.
          content:
            application/json:
              schema:
                type: object
                required: [message, total, report]
                properties:
                  message: { type: string }
                  total: { type: integer }
                  report:
                    $ref: '#/components/schemas/RetentionReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /metrics:
    servers:
      - url: http://localhost:3333
    get:
      tags: [Observability]
      security:
        - metricsToken: []
      summary: Métricas no formato de texto do Prometheus (só existe com `METRICS_TOKEN`; 404 sem ele).
      responses:
        '200':
          description: Exposição Prometheus (`text/plain; version=0.0.4`).
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: argos_refresh
    metricsToken:
      type: http
      scheme: bearer
      description: Valor de `METRICS_TOKEN` (somente `/metrics`).
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: integer
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: integer
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    SpaceFilter:
      name: spaceId
      in: query
      description: Só casos ligados a este espaço institucional.
      schema:
        type: integer
