openapi: 3.0.3
info:
  title: ARGOS API
  version: 1.0.0
  description: Contrato da API versionada do ARGOS (instalação de campus único). As rotas valem em /api/v1 e no alias legado /api. Rotas autenticadas usam Bearer (access token curto) e o refresh token fica em cookie httpOnly. Validado automaticamente contra as rotas Express e os clientes web/Flutter em backend/test/contract.test.ts.
servers:
  - url: http://localhost:3333/api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Auth
      security: []
      summary: Cria uma conta (pendente de confirmação de e-mail) ou solicita acesso institucional.
      description: |
        Cadastro por senha cria a conta sem e-mail verificado e **não** emite sessão: um link de uso único
        (válido por `EMAIL_VERIFICATION_TTL_HOURS`, padrão 24 h) é enviado ao e-mail. Login só funciona após
        `POST /auth/verify-email`. A versão do aviso de privacidade gravada é sempre a do servidor; se o cliente
        enviar `privacyTermsVersion` diferente da vigente, a resposta é 409 `terms_outdated`.
        Com CAPTCHA configurado no servidor, `captchaToken` é obrigatório.
        Solicitação de acesso (`requestAccess: true`) não define senha (o campo é opcional e ignorado nesse caso):
        se a administração aprovar, a conta nasce confirmada com uma senha temporária entregue por canal
        institucional, e a pessoa também pode criar a própria senha por `POST /auth/forgot-password`.
        Um pedido rejeitado volta a pendente quando enviado de novo; um pedido aprovado não é reaberto (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada; confirmação de e-mail pendente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '202':
          description: Solicitação de acesso registrada como pendente (a resposta inclui `id` e a explicação dos próximos passos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: E-mail já cadastrado, solicitação já aprovada ou versão do aviso desatualizada (`details.code = terms_outdated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Autentica usuário e emite sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie httpOnly do refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais inválidas. A mesma resposta é usada para e-mail inexistente e senha incorreta; o e-mail é comparado sem diferenciar maiúsculas e espaços.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Conta bloqueada ou pendente (`details.code = account_inactive`), ou e-mail ainda não confirmado (`details.code = email_unverified`; um novo link é enviado respeitando o limite). O estado da conta só é informado com a senha correta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Limite de tentativas. Até 10 por minuto para a mesma conta a partir do mesmo IP e até 60 por minuto por IP somando todas as contas (redes com NAT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      tags: [Auth]
      security:
        - refreshCookie: []
      summary: Rotaciona refresh token e emite novo access token.
      description: |
        Cada refresh token é de uso único. Reapresentar um token já rotacionado é tratado como reuso:
        todas as sessões do usuário são revogadas e o cookie é limpo (401). Exceção: se o token foi
        rotacionado há até 10 segundos (requisições concorrentes ou outra aba), a resposta é 409 sem
        revogar nada nem alterar o cookie; o cliente deve repetir a chamada uma vez com o cookie atual.
        O limite de requisições é aplicado por sessão quando há cookie e por IP caso contrário.
      responses:
        '200':
          description: Sessão renovada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Token rotacionado por outra requisição há instantes. Repita a chamada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          description: Origin de navegador não autorizado (proteção CSRF) ou, no refresh, e-mail não confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoga refresh token e encerra sessão.
      responses:
        '200':
          description: Sessão encerrada.
        '403':
          description: Origin de navegador não autorizado (proteção CSRF) ou, no refresh, e-mail não confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /auth/me:
    get:
      tags: [Auth]
      summary: Retorna usuário autenticado.
      responses:
        '200':
          description: Usuário atual.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Auth]
      summary: Atualiza perfil e preferencias do usuario autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Auth]
      summary: Exclui a conta (anonimiza dados pessoais, remove casos abertos, pistas e acompanhamentos). Administradores são recusados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Conta excluída.
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Troca a senha, revoga todas as sessões e devolve uma nova sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        '200':
          description: Senha alterada; corpo igual ao do login.
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Envia por e-mail um link de redefinição (válido por 1 hora). Resposta idêntica para e-mails inexistentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Solicitação aceita.
  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      summary: Define nova senha com o token do e-mail (uso único) e encerra todas as sessões.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        '200':
          description: Senha redefinida.
        '400':
          description: Link inválido, usado ou expirado.
  /items/search:
    get:
      tags: [Items]
      security: []
      summary: Busca pública de itens aprovados.
      parameters:
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/ItemType'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/ItemStatus'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/HasImage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lista paginada de itens públicos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicItems'
  /items:
    get:
      tags: [Items]
      summary: Lista itens do usuário autenticado.
      responses:
        '200':
          description: Itens privados do usuário.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrivateItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Items]
      summary: Publica item aprovado com data do ocorrido informada ou data atual.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Chave por usuário de 16 a 100 caracteres. Repetir o mesmo payload devolve o mesmo ID; mudar o payload retorna 409. Guarde a chave ao receber timeout.
          schema: { type: string, pattern: '^[a-zA-Z0-9_-]{16,100}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Item criado; resposta contém id e message.
        '200':
          description: Operação repetida; resposta contém id original, message e replayed verdadeiro.
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /items/following:
    get:
      tags: [Items]
      summary: Lista acompanhamentos visíveis da conta autenticada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Itens acompanhados, sem dados privados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /items/my-claims:
    get:
      tags: [Claims]
      summary: Lista apenas as solicitações enviadas pela conta autenticada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Resumo paginado sem provas ou identificação de outros solicitantes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        item_id: { type: integer }
                        item_title: { type: string }
                        item_status: { type: string }
                        status: { type: string, enum: [pending, approved, rejected] }
                        created_at: { type: string }
                  meta:
                    $ref: '#/components/schemas/MobilePageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /items/{id}:
    get:
      tags: [Items]
      security: []
      summary: Retorna detalhe público ou privado conforme sessão.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Detalhe do item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    oneOf:
                      - $ref: '#/components/schemas/PublicItem'
                      - $ref: '#/components/schemas/PrivateItem'
                  capabilities:
                    type: object
                    description: Capacidades calculadas pelo servidor; não substituem a autorização de cada operação.
                    properties:
                      edit: { type: boolean }
                      delete:
                        type: boolean
                        description: Autor ou moderador; casos devolvidos só podem ser excluídos por moderadores.
                      return: { type: boolean }
                      readClaims: { type: boolean }
                      claim: { type: boolean }
                  following: { type: boolean }
                  myClaim:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer }
                      status: { type: string }
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemHistory'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Items]
      summary: Atualiza item próprio ou moderado.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Item atualizado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Dados inválidos, tentativa de alterar o tipo ou imagem que não pertence ao usuário. Moderadores podem reenviar a imagem atual do autor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Items]
      summary: Exclui um item e seus dados dependentes.
      description: |
        Permitido ao autor e a perfis com `items:moderate`. Casos devolvidos são mantidos no histórico e só
        podem ser excluídos por moderadores. Pistas, reivindicações, acompanhamentos e correspondências são
        removidos em cascata; reivindicantes com pedido aberto e seguidores recebem notificação `item_removed`,
        e o autor é notificado quando a exclusão é feita pela moderação. A operação é registrada na auditoria.
        Um replay de `Idempotency-Key` da criação desse item passa a responder 409.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Item excluído.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  requestId: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Item inexistente, ou não aprovado e sem acesso do solicitante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Caso devolvido; apenas moderadores podem excluí-lo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /items/{id}/comments:
    get:
      tags: [Comments]
      security: []
      summary: Lista pistas públicas; informar page habilita paginação, sem page preserva a listagem legada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pistas publicas do item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  meta:
                    $ref: '#/components/schemas/MobilePageMeta'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      summary: Cria pista publica em item publicado.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Pista publica criada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /items/{id}/follow:
    post:
      tags: [Items]
      summary: Acompanha um caso para receber atualizacoes.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Caso acompanhado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Items]
      summary: Remove acompanhamento de um caso.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Acompanhamento removido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /items/{id}/report:
    post:
      tags: [Items]
      summary: Sinaliza item suspeito ou inadequado para moderacao.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Sinalizacao registrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /items/{id}/claim:
    post:
      tags: [Claims]
      summary: Cria reivindicação de item.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequest'
      responses:
        '201':
          description: Reivindicação criada.
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Claims]
      summary: Cancela a reivindicação aberta do próprio usuário; o caso volta ao status original se não restar outra.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reivindicação cancelada (status withdrawn).
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /items/{id}/claims:
    get:
      tags: [Claims]
      summary: Lista reivindicações de um item para dono ou usuário autorizado.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reivindicações do item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Claim'
                  requestId:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /items/{id}/claims/{claimId}/reject:
    patch:
      tags: [Claims]
      summary: Dono do caso (ou claims:review) recusa uma reivindicação aberta.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: claimId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reivindicação recusada.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Reivindicação já encerrada ou caso devolvido.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /items/{id}/comments/{commentId}:
    delete:
      tags: [Comments]
      summary: Remove uma pista pública (autor ou items:moderate).
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pista removida.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /items/{id}/return:
    patch:
      tags: [Items]
      summary: Marca item como devolvido.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Devolução registrada.
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /uploads:
    post:
      tags: [Uploads]
      summary: Envia imagem autenticada.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Upload criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: |
            Arquivo ausente, tipo diferente de JPEG/PNG/WebP, conteúdo que não corresponde ao tipo declarado
            (magic bytes), imagem corrompida ou mais de um arquivo no campo `file`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/items:
    get:
      tags: [Admin]
      summary: Lista itens para moderação global.
      parameters:
        - name: approvalStatus
          in: query
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ItemStatus'
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Itens para administração.
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/items/{id}/status:
    patch:
      tags: [Admin]
      summary: Atualiza aprovação ou status operacional.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approvalStatus:
                  $ref: '#/components/schemas/ApprovalStatus'
                status:
                  $ref: '#/components/schemas/ItemStatus'
                moderationNote:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Status atualizado.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/users:
    get:
      tags: [Admin]
      summary: Lista usuários.
      responses:
        '200':
          description: Usuários com a pontuação manual de restrição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Atualiza role, status ou score anti-spam.
      description: Bloquear ou tornar pendente revoga imediatamente todos os refresh tokens do usuário.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [citizen, space_manager, org_admin, support, admin]
                status:
                  type: string
                  enum: [pending, active, blocked]
                spamScore:
                  type: integer
                  minimum: 0
                  maximum: 10
      responses:
        '200':
          description: Usuário atualizado.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Dados inválidos ou tentativa do administrador de remover o próprio acesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/access-requests:
    get:
      tags: [Admin]
      summary: Lista solicitações de acesso.
      responses:
        '200':
          description: Solicitações.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/access-requests/{id}:
    patch:
      tags: [Admin]
      summary: Aprova ou rejeita uma solicitação de acesso pendente.
      description: |
        Só pedidos `pending` são avaliados. Na aprovação, se ainda não existir conta com o e-mail, ela é criada
        confirmada e a resposta traz `temporaryPassword` (exibida uma única vez ao administrador, que a entrega por
        canal institucional).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                role:
                  type: string
                  enum: [citizen, admin]
                  default: citizen
      responses:
        '200':
          description: Solicitação revisada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  temporaryPassword:
                    type: string
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A solicitação já foi avaliada (`details.currentStatus`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /audit-logs:
    get:
      tags: [Audit]
      summary: Lista eventos de auditoria para admin global.
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Eventos de auditoria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    type: object
                  requestId:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications:
    get:
      tags: [Notifications]
      summary: Lista notificações do usuário.
      responses:
        '200':
          description: 50 notificações mais recentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Conta notificações não lidas.
      responses:
        '200':
          description: Total de não lidas.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Marca notificações do usuário como lidas.
      responses:
        '200':
          description: Notificações marcadas.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Marca uma notificação do usuário como lida (idempotente).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notificação marcada.
        '404':
          description: Notificação inexistente ou de outro usuário.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reports/items.csv:
    get:
      tags: [Reports]
      summary: Exporta relatório CSV de itens.
      responses:
        '200':
          description: Arquivo CSV.
          content:
            text/csv:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /privacy/summary:
    get:
      tags: [Privacy]
      security: []
      summary: Retorna resumo básico de privacidade.
      responses:
        '200':
          description: Resumo vigente, prazos de retenção e situação do aceite da conta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySummary'
  /privacy/export:
    get:
      tags: [Privacy]
      summary: Exporta em JSON os dados da própria conta (portabilidade LGPD).
      responses:
        '200':
          description: Arquivo JSON (Content-Disposition attachment).
        '401':
          $ref: '#/components/responses/Unauthorized'
  /config:
    get:
      tags: [Config]
      security: []
      summary: Integrações ligadas no servidor (mapa, IA, tradução, Google, Turnstile, chave pública de push). Nunca expõe segredos.
      responses:
        '200':
          description: Configuração pública.
  /items/map:
    get:
      tags: [Items]
      security: []
      summary: Casos aprovados com marcação no mapa (coordenadas arredondadas a ~11 m). Filtros type e includeReturned.
      responses:
        '200':
          description: Até 500 casos com latitude e longitude.
  /items/{id}/translate:
    post:
      tags: [Items]
      security: []
      summary: Traduz título e descrição (DeepL ou LibreTranslate), com cache por idioma. 503 quando não configurado.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language:
                  type: string
                  enum: [pt-BR, en-US, es-ES]
      responses:
        '200':
          description: Tradução.
        '503':
          description: Tradução automática não configurada.
  /ai/describe-item:
    post:
      tags: [AI]
      summary: Sugere título, categoria e descrição a partir de uma foto enviada pela própria conta (Claude API). 503 quando não configurado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageUrl]
              properties:
                imageUrl:
                  type: string
                  example: /uploads/1790000000000-abc12345.jpg
      responses:
        '200':
          description: Sugestões (title, category, description, color, distinctiveFeatures).
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: IA não configurada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/google:
    post:
      tags: [Auth]
      security: []
      summary: Login com Google (ID token do Google Identity Services). Conta nova exige privacyTermsAccepted (senão 422 com details.code terms_required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                privacyTermsAccepted:
                  type: boolean
      responses:
        '200':
          description: Sessão criada; corpo igual ao do login.
        '401':
          description: Token do Google inválido ou e-mail não verificado.
        '422':
          $ref: '#/components/responses/ValidationError'
  /push/subscribe:
    post:
      tags: [Push]
      summary: Registra a inscrição Web Push do navegador (PushSubscription.toJSON()).
      responses:
        '201':
          description: Inscrição salva.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Push]
      summary: Remove a inscrição Web Push pelo endpoint.
      responses:
        '200':
          description: Inscrição removida.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /push/test:
    post:
      tags: [Push]
      summary: Envia uma notificação de teste para os navegadores inscritos do usuário.
      responses:
        '200':
          description: Enviada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/mail-test:
    post:
      tags: [Admin]
      summary: Confere a conexão SMTP e envia um e-mail de teste ao administrador.
      responses:
        '200':
          description: Resultado (configured true/false).
        '502':
          description: Servidor SMTP recusou a conexão.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/verify-email:
    post:
      tags:
        - Auth
      security: []
      summary: Confirma o e-mail com o token recebido (uso único, com expiração). Não emite sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
      responses:
        '200':
          description: E-mail confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Token inválido, já usado ou expirado (`details.code = verification_invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/resend-verification:
    post:
      tags:
        - Auth
      security: []
      summary: Reenvia o link de confirmação (no máximo 1 por minuto e 5 por dia por conta). Resposta idêntica para qualquer e-mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Pedido aceito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /privacy/consents:
    post:
      tags:
        - Privacy
      summary: Registra o aceite da versão vigente do aviso de privacidade (quando o texto é atualizado).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: Aceite da versão vigente já registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '201':
          description: Aceite registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Versão informada não é a vigente (`details.code = terms_outdated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Métricas e itens recentes. Administrador vê a instalação inteira; demais perfis, apenas os próprios itens.
      responses:
        '200':
          description: Painel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /saved-searches:
    get:
      tags:
        - SavedSearches
      summary: Lista as pesquisas salvas da conta.
      responses:
        '200':
          description: Pesquisas salvas.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedSearch'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - SavedSearches
      summary: Salva uma pesquisa (até 20 por conta) para receber avisos de itens novos ou editados que corresponderem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSearchCreate'
      responses:
        '201':
          description: Pesquisa salva.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - message
                properties:
                  id:
                    type: integer
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /saved-searches/{id}:
    patch:
      tags:
        - SavedSearches
      summary: Atualiza nome, filtros ou ativação de uma pesquisa salva própria.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSearchUpdate'
      responses:
        '200':
          description: Pesquisa atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - SavedSearches
      summary: Remove uma pesquisa salva própria.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pesquisa removida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /items/{id}/matches:
    get:
      tags:
        - Items
      summary: Possíveis correspondências (pares perdido/encontrado), recalculadas na criação e após edições. Autor ou moderador.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Correspondências ordenadas por pontuação.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemMatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/reports:
    get:
      tags:
        - Admin
      summary: Fila de denúncias paginada, filtrável por estado (padrão `active` = abertas + em análise).
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - all
              - open
              - in_review
              - resolved
              - dismissed
            default: active
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página da fila.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemReportPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/reports/{id}:
    patch:
      tags:
        - Admin
      summary: Assume, atribui, resolve, descarta ou reabre uma denúncia (auditado, com controle de concorrência).
      description: |
        Transições: open → in_review/resolved/dismissed; in_review → open/resolved/dismissed;
        resolved/dismissed → open. `assignee: "me"` em denúncia aberta a coloca em análise.
        Se `expectedStatus` não corresponder ao estado atual, ou outra requisição alterar a denúncia
        ao mesmo tempo, a resposta é 409 e nada é gravado.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemReportUpdate'
      responses:
        '200':
          description: Denúncia atualizada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - report
                properties:
                  message:
                    type: string
                  report:
                    $ref: '#/components/schemas/ItemReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /health/live:
    servers:
      - url: http://localhost:3333
    get:
      tags:
        - Health
      security: []
      summary: Liveness do processo (fora do prefixo /api/v1).
      responses:
        '200':
          description: Processo ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
  /api/health:
    servers:
      - url: http://localhost:3333
    get:
      tags:
        - Health
      security: []
      summary: Alias legado de /health/live.
      responses:
        '200':
          description: Processo ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
  /health/ready:
    servers:
      - url: http://localhost:3333
    get:
      tags:
        - Health
      security: []
      summary: Readiness, incluindo acesso ao banco e versão do esquema migrado.
      responses:
        '200':
          description: Pronto para receber tráfego.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
        '503':
          description: Banco indisponível.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - not_ready
                  database:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: argos_refresh
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    SearchText:
      name: q
      in: query
      schema:
        type: string
    ItemType:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/ItemType'
    Category:
      name: category
      in: query
      schema:
        type: string
    Location:
      name: location
      in: query
      schema:
        type: string
    ItemStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/ItemStatus'
    FromDate:
      name: from
      in: query
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      schema:
        type: string
        format: date
    HasImage:
      name: hasImage
      in: query
      schema:
        type: boolean
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [newest, oldest, event_date_desc, event_date_asc]
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  schemas:
    MobilePageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    Role:
      type: string
      enum:
        - user
        - citizen
        - space_manager
        - org_admin
        - support
        - admin
      description: |
        Instalação de campus único: só `admin` tem alcance global. `space_manager`, `org_admin` e `support`
        não têm modelo de organização/espaço e recebem apenas permissões de cidadão (falha fechada);
        a administração só atribui `citizen` ou `admin`.
    Permission:
      type: string
    User:
      type: object
      required: [id, name, email, role, status]
      properties:
        id:
          type: integer
        name:
          type: string
        nickname:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [pending, active, blocked]
        spamScore:
          type: integer
        avatarUrl:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        preferredContact:
          type: string
          enum: [in_app, email]
          description: Informativo e sem efeito no comportamento atual (avisos por e-mail são controlados em notificationPreferences).
        language:
          type: string
          enum: [pt-BR, en-US, es-ES]
        theme:
          type: string
          enum: [system, light, dark]
        timezone:
          type: string
        dateFormat:
          type: string
          enum: [dd/MM/yyyy, MM/dd/yyyy, yyyy-MM-dd]
        compactMode:
          type: boolean
        highContrast:
          type: boolean
        notificationPreferences:
          $ref: '#/components/schemas/NotificationPreferences'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        emailVerified:
          type: boolean
    NotificationPreferences:
      type: object
      properties:
        emailEnabled:
          type: boolean
        inAppEnabled:
          type: boolean
        digestEnabled:
          type: boolean
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        nickname:
          type: string
          nullable: true
          maxLength: 40
          description: Identificador publico exibido no feed.
        avatarUrl:
          type: string
          nullable: true
          description: Caminho de upload do ARGOS ou URL http(s).
        phone:
          type: string
          nullable: true
          maxLength: 30
        department:
          type: string
          nullable: true
          maxLength: 120
        bio:
          type: string
          nullable: true
          maxLength: 300
        preferredContact:
          type: string
          enum: [in_app, email]
          description: Informativo e sem efeito no comportamento atual (avisos por e-mail são controlados em notificationPreferences).
        language:
          type: string
          enum: [pt-BR, en-US, es-ES]
        theme:
          type: string
          enum: [system, light, dark]
        timezone:
          type: string
        dateFormat:
          type: string
          enum: [dd/MM/yyyy, MM/dd/yyyy, yyyy-MM-dd]
        compactMode:
          type: boolean
        highContrast:
          type: boolean
        notificationPreferences:
          $ref: '#/components/schemas/NotificationPreferences'
    RegisterRequest:
      type: object
      description: '`password` é obrigatório no cadastro comum e ignorado quando `requestAccess` é true.'
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 120
        requestAccess:
          type: boolean
        reason:
          type: string
          maxLength: 500
        privacyTermsAccepted:
          type: boolean
        privacyTermsVersion:
          type: string
          description: Opcional. Versão exibida ao usuário; precisa ser a vigente (GET /privacy/summary) ou a resposta é 409.
        captchaToken:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
